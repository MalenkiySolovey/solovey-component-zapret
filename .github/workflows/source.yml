name: Zapret component source

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  GOWORK: off
  GOFLAGS: -mod=readonly

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.16.0'
      - run: node scripts/check-source.mjs
      - run: go test -race -count=1 ./...
      - run: go vet ./...

  upstream-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false
      - name: Install engine build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gcc make pkg-config zlib1g-dev libcap-dev libnetfilter-queue-dev libmnl-dev libnfnetlink-dev liblua5.4-dev
      - name: Compare two independent source builds on the same toolchain
        run: |
          bash scripts/build-nfqws2.sh "$RUNNER_TEMP/nfqws2-a"
          bash scripts/build-nfqws2.sh "$RUNNER_TEMP/nfqws2-b"
          cd "$RUNNER_TEMP/nfqws2-b"
          sha256sum -c "$RUNNER_TEMP/nfqws2-a/SHA256SUMS"
      - name: Validate the component's compiled argv without packet interception
        run: |
          SOLOVEY_TEST_ENGINE_ROOT="$RUNNER_TEMP/nfqws2-a" go test -count=1 -run '^TestPinnedEngineValidatesProfiles$' -v ./strategy
