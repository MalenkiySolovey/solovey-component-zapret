name: Zapret component source

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  GOWORK: off
  GOFLAGS: -mod=readonly

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.16.0'
      - run: node scripts/check-source.mjs
      - run: go test -race -count=1 ./...
      - run: go vet ./...

  upstream-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false
      - name: Install engine build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gcc make pkg-config zlib1g-dev libcap-dev libnetfilter-queue-dev libmnl-dev libnfnetlink-dev liblua5.4-dev nftables
      - name: Compare two independent source builds on the same toolchain
        run: |
          bash scripts/build-nfqws2.sh "$RUNNER_TEMP/nfqws2-a"
          bash scripts/build-nfqws2.sh "$RUNNER_TEMP/nfqws2-b"
          cd "$RUNNER_TEMP/nfqws2-b"
          sha256sum -c "$RUNNER_TEMP/nfqws2-a/SHA256SUMS"
      - name: Validate the component's compiled argv without packet interception
        run: |
          SOLOVEY_TEST_ENGINE_ROOT="$RUNNER_TEMP/nfqws2-a" go test -count=1 -run '^TestPinnedEngineValidatesProfiles$' -v ./strategy
      - name: Require fail-closed queue overload in a disposable namespace
        run: |
          test "$GITHUB_ACTIONS" = true
          go test -c -o "$RUNNER_TEMP/zapret-queue-test" ./strategy
          sudo modprobe nfnetlink_queue
          sudo modprobe nft_queue
          sudo unshare --net -- env SOLOVEY_TEST_PARENT_NETNS="$(readlink /proc/self/ns/net)" \
            SOLOVEY_TEST_ENGINE_ROOT="$RUNNER_TEMP/nfqws2-a" bash -euc '
              ip link set lo up
              exec "$1" -test.run "^TestPinnedEngineQueueOverloadDrops$" -test.v -test.timeout=30s
            ' _ "$RUNNER_TEMP/zapret-queue-test"
      - name: Verify native trace and managed Lua in a disposable namespace
        run: |
          test "$GITHUB_ACTIONS" = true
          commit=$(node -p "require('./upstream/zapret2.json').commit")
          curl --fail --silent --show-error --max-time 20 --max-filesize 1200 --proto '=https' \
            "https://raw.githubusercontent.com/bol-van/zapret2/$commit/files/fake/quic_initial_www_google_com.bin" \
            -o "$RUNNER_TEMP/quic-initial.bin"
          # The engine loads Lua after dropping privileges. The runner's home
          # directory cannot serve as the installed engine root for that UID.
          engine=$(sudo mktemp -d /usr/local/lib/solovey-zapret-trace.XXXXXXXX)
          trap 'sudo rm -f -- "$engine/nfqws2" "$engine/lua/zapret-lib.lua" "$engine/lua/zapret-antidpi.lua" "$engine/lua/zapret-auto.lua"; sudo rmdir -- "$engine/lua" "$engine"' EXIT
          sudo install -d -m 0755 "$engine/lua"
          sudo install -m 0755 "$RUNNER_TEMP/nfqws2-a/nfqws2" "$engine/nfqws2"
          sudo install -m 0644 "$RUNNER_TEMP/nfqws2-a/lua/"{zapret-lib,zapret-antidpi,zapret-auto}.lua "$engine/lua/"
          sudo chmod 0755 "$engine"
          sudo unshare --net -- env SOLOVEY_TEST_PARENT_NETNS="$(readlink /proc/self/ns/net)" \
            SOLOVEY_TEST_ENGINE_ROOT="$engine" SOLOVEY_TEST_QUIC_INITIAL="$RUNNER_TEMP/quic-initial.bin" bash -euc '
              ip link set lo up
              exec "$1" -test.run "^TestPinnedEngine(ReportsMatchedNativeProfiles|RunsManagedLua|AppliesManagedLuaVerdicts|RunsManagedCircular)$" -test.v -test.timeout=30s
            ' _ "$RUNNER_TEMP/zapret-queue-test"
